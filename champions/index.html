<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>We are the champions</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <main>
            <div class="header">
                <img src="img/Freddie.png" alt="Freddie Mercury">
                <h1>We are the Champions</h1>
            </div>
            <section class="input">
                <form>
                    <textarea required id="text" placeholder="Write your endorsement here"></textarea>
                    <div id="persons">
                        <input required id="from" type="text" placeholder="From">
                        <input required id="to" type="text" placeholder="To">
                    </div>
                    <div id="publish" onclick="publish()"> Publish</div>
                </form>
            </section>
            <section id="endorsements">
                <h3>- Endorsements -</h3>
                <div class="item">
                    <h4>To Leanne</h4>
                    Leanne! Thank you so much for helping me with the March accounting. Saved so much time because of you! 💜 Frode
                    <h4>From Frode</h4>
                </div>
            </section>
        </main>
        <script src="script.js"></script>
    </body>
</html>
