<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, intial-scale=1.0">
        <meta charset="UTF-8">
        <title>Unit Conversation</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    
    <body>
        <main>
            <button id="theme" onclick="theme()">Theme</button>
            <div id="top">
                <h1>Metric/Imperial Unit Conversion</h1>
                <input id="number" type="number" name value="20" placeholder="20">
                <button>Convert</button>
            </div>
            <div class="bottom">
                <div class="item">
                    <h3>
                        Length (Meter/Feet)
                    </h3>
                    <p>20 meters = 65.616 feet | 20 feet = 6.096 meters</p>
                </div>
                <div class="item">
                    <h3>
                        Volume (Liters/Gallons)
                    </h3>
                    <p>20 liters = 5.284 gallons | 20 gallons = 75.708 liters</p>
                </div>
                <div class="item">
                    <h3>
                        Mass (Kilograms/Pounds)
                    </h3>
                    <p>20 kilos = 44.092 pounds | 20 pounds = 9.072 kilos</p>
                </div>
            </div>
        </main>
    </body>
    <script src="script.js"></script>
</html>
