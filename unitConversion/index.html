<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, intial-scale=1.0">
        <meta charset="UTF-8">
        <title>Unit Conversation</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    
    <body>
        <main>
            <button id="theme" onclick="theme()">Theme</button>
            <div id="top">
                <h1>Metric/Imperial Unit Conversion</h1>
                <input id="number" type="number" name value="20" placeholder="20">
                <button onclick="convert()">Convert</button>
            </div>
            <div class="bottom">
                <div class="item">
                    <h3>
                        Length (Meter/Feet)
                    </h3>
                    <p><span class="inp">20</span> meters = <span class="values">65.62</span> feet | <span class="inp">20</span> feet = <span class="values">6.10</span> meters</p>
                </div>
                <div class="item">
                    <h3>
                        Volume (Liters/Gallons)
                    </h3>
                    <p><span class="inp">20</span> liters = <span class="values">5.28</span> gallons | <span class="inp">20</span> gallons = <span class="values">75.76</span> liters</p>
                </div>
                <div class="item">
                    <h3>
                        Mass (Kilograms/Pounds)
                    </h3>
                    <p><span class="inp">20</span> kilos = <span class="values">44.08</span> pounds | <span class="inp">20</span> pounds = <span class="values">9.07</span> kilos</p>
                </div>
            </div>
        </main>
    </body>
    <script src="script.js"></script>
</html>
